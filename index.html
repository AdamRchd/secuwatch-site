<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuWatch Pro - Cyber Audit</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .container { width: 100%; max-width: 900px; }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: white;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }

        .btn-pdf {
            margin-top: 15px;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            display: none; 
            border: 1px solid #ccc;
        }

        #results { display: none; }
        
        .score-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .score-val { font-size: 3em; font-weight: bold; margin: 10px 0; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .details-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .full-width {
            grid-column: span 2;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .status-ok { color: var(--success); }
        .status-bad { color: var(--danger); }
        .status-warn { color: var(--warning); }
        
        .loader { text-align: center; display: none; margin-top: 20px; }

        .history-section {
            margin-top: 40px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #94a3b8; border-bottom: 1px solid var(--border); padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #1e293b; color: var(--text-color); }
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align: center;">🛡️ SecuWatch Pro</h1>
        <p style="text-align: center; color: #94a3b8; margin-bottom: 40px;">Scanner de Vulnérabilités & OSINT</p>

        <div class="search-box">
            <input type="text" id="domainInput" placeholder="Entrez un domaine (ex: google.com)">
            <button onclick="launchScan()">Scanner</button>
        </div>

        <div class="loader" id="loader">
            ⏳ Analyse approfondie en cours (Ports & Config)...
        </div>

        <div id="results">
            <div class="score-card">
                <div>Score de Sécurité</div>
                <div class="score-val" id="scoreDisplay">--/100</div>
                <div id="scoreText">Analyse terminée</div>
                
                <button id="btnReport" class="btn-pdf" onclick="downloadReport()">
                    📄 Télécharger le Rapport PDF
                </button>
            </div>

            <div class="grid">
                <div class="details-card">
                    <h3>🔒 Certificat SSL</h3>
                    <div id="sslContent"></div>
                </div>

                <div class="details-card">
                    <h3>🛡️ Headers HTTP</h3>
                    <div id="headersContent"></div>
                </div>

                <div class="details-card full-width">
                    <h3>🕵️‍♂️ Reconnaissance Réseau & OSINT</h3>
                    <div id="networkContent"></div>
                </div>
            </div>
        </div>

        <div class="history-section">
            <h3 style="margin-top: 0;">🕒 Derniers Scans</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Domaine</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const API_URL = "https://secuwatch-api.onrender.com"; 

        async function launchScan() {
            const domain = document.getElementById('domainInput').value;
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const btnReport = document.getElementById('btnReport');
            
            if(!domain) return alert("Veuillez entrer un domaine !");

            results.style.display = 'none';
            btnReport.style.display = 'none'; 
            loader.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/scan?domain=${domain}`);
                const data = await response.json();

                const scoreDisplay = document.getElementById('scoreDisplay');
                scoreDisplay.innerText = `${data.security_score}/100`;
                scoreDisplay.style.color = data.security_score > 70 ? '#22c55e' : '#ef4444';

                let sslHtml = `<div class="item"><span>Valide :</span> <span class="${data.ssl_status.valid ? 'status-ok' : 'status-bad'}">${data.ssl_status.valid ? 'OUI' : 'NON'}</span></div>`;
                if(data.ssl_status.valid) {
                    sslHtml += `<div class="item"><span>Expiration :</span> <span>J-${data.ssl_status.days_left}</span></div>`;
                }
                document.getElementById('sslContent').innerHTML = sslHtml;

                let headersHtml = '';
                for (const [key, value] of Object.entries(data.headers_status)) {
                    const isOk = value.includes("Présent");
                    const cleanValue = isOk ? "✅ OK" : "❌";
                    headersHtml += `<div class="item"><span>${key}</span> <span class="${isOk ? 'status-ok' : 'status-bad'}">${cleanValue}</span></div>`;
                }
                document.getElementById('headersContent').innerHTML = headersHtml;

                let networkHtml = '';
                
                const ports = data.open_ports;
                if(ports.length > 0) {
                    networkHtml += `<div class="item"><span>Ports Ouverts (Risque) :</span> <span class="status-bad">${ports.join(', ')}</span></div>`;
                    networkHtml += `<div style="font-size:0.8em; color:#94a3b8; margin-top:5px;">⚠️ Les ports ouverts augmentent la surface d'attaque.</div>`;
                } else {
                    networkHtml += `<div class="item"><span>Ports Critiques :</span> <span class="status-ok">🛡️ Tous fermés/filtrés</span></div>`;
                }

                const secTxt = data.security_txt ? "✅ Trouvé" : "❌ Absent";
                const secClass = data.security_txt ? "status-ok" : "status-warn";
                networkHtml += `<div class="item" style="margin-top:10px;"><span>Fichier security.txt :</span> <span class="${secClass}">${secTxt}</span></div>`;

                document.getElementById('networkContent').innerHTML = networkHtml;

                loader.style.display = 'none';
                results.style.display = 'block';
                btnReport.style.display = 'inline-block';

                loadHistory();

            } catch (error) {
                console.error(error);
                alert("Erreur API ou Timeout. Le scan de ports peut prendre du temps.");
                loader.style.display = 'none';
            }
        }

        function downloadReport() {
            const domain = document.getElementById('domainInput').value;
            if(!domain) return;
            window.open(`${API_URL}/report?domain=${domain}`, '_blank');
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/history`);
                const history = await response.json();
                
                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = '';

                history.forEach(scan => {
                    const dateObj = new Date(scan.date);
                    const dateStr = dateObj.toLocaleDateString('fr-FR');
                    
                    let color = '#ef4444';
                    if(scan.score > 70) color = '#22c55e';
                    else if(scan.score > 50) color = '#eab308';

                    const row = `
                        <tr>
                            <td style="font-size: 0.9em; color: #94a3b8;">${dateStr}</td>
                            <td>${scan.domain}</td>
                            <td style="font-weight: bold; color: ${color};">${scan.score}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Erreur historique", error);
            }
        }

        loadHistory();
    </script>
</body>
</html>
