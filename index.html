<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuWatch Lite - Cyber Audit</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .container { width: 100%; max-width: 800px; }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: white;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }

        .btn-pdf {
            margin-top: 15px;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            display: none;
            border: 1px solid #ccc;
        }

        #results { display: none; }
        
        .score-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .score-val { font-size: 3em; font-weight: bold; margin: 10px 0; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .details-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        .status-ok { color: var(--success); }
        .status-bad { color: var(--danger); }
        
        .loader { text-align: center; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align: center;">🛡️ SecuWatch Lite</h1>
        <p style="text-align: center; color: #94a3b8; margin-bottom: 40px;">Scanner de conformité SSL & HTTP Headers</p>

        <div class="search-box">
            <input type="text" id="domainInput" placeholder="Entrez un domaine (ex: google.com)">
            <button onclick="launchScan()">Scanner</button>
        </div>

        <div class="loader" id="loader">
            ⏳ Analyse en cours... (Cela peut prendre 5-10 secondes)
        </div>

        <div id="results">
            <div class="score-card">
                <div>Score de Sécurité</div>
                <div class="score-val" id="scoreDisplay">--/100</div>
                <div id="scoreText">Analyse terminée</div>
                
                <button id="btnReport" class="btn-pdf" onclick="downloadReport()">
                    📄 Télécharger le Rapport PDF
                </button>
            </div>

            <div class="grid">
                <div class="details-card">
                    <h3>🔒 Certificat SSL</h3>
                    <div id="sslContent"></div>
                </div>

                <div class="details-card">
                    <h3>🛡️ Headers de Sécurité</h3>
                    <div id="headersContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function launchScan() {
            const domain = document.getElementById('domainInput').value;
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const btnReport = document.getElementById('btnReport');
            
            if(!domain) return alert("Veuillez entrer un domaine !");

            results.style.display = 'none';
            btnReport.style.display = 'none'; 
            loader.style.display = 'block';

            try {
                const response = await fetch(`https://secuwatch-api.onrender.com/scan?domain=${domain}`);
                const data = await response.json();

                const scoreDisplay = document.getElementById('scoreDisplay');
                scoreDisplay.innerText = `${data.security_score}/100`;
                scoreDisplay.style.color = data.security_score > 70 ? '#22c55e' : '#ef4444';

                let sslHtml = `<div class="item"><span>Valide :</span> <span class="${data.ssl_status.valid ? 'status-ok' : 'status-bad'}">${data.ssl_status.valid ? 'OUI' : 'NON'}</span></div>`;
                if(data.ssl_status.valid) {
                    sslHtml += `<div class="item"><span>Jours restants :</span> <span>${data.ssl_status.days_left}</span></div>`;
                    let issuer = data.ssl_status.issuer;
                    if(issuer.length > 20) issuer = issuer.substring(0, 20) + '...';
                    sslHtml += `<div class="item"><span>Émetteur :</span> <span style="font-size:0.8em">${issuer}</span></div>`;
                }
                document.getElementById('sslContent').innerHTML = sslHtml;

                let headersHtml = '';
                for (const [key, value] of Object.entries(data.headers_status)) {
                    const isOk = value.includes("Présent");
                    const cleanValue = isOk ? "✅ Activé" : "❌ Manquant";
                    headersHtml += `<div class="item"><span>${key}</span> <span class="${isOk ? 'status-ok' : 'status-bad'}">${cleanValue}</span></div>`;
                }
                document.getElementById('headersContent').innerHTML = headersHtml;

                loader.style.display = 'none';
                results.style.display = 'block';
                
                btnReport.style.display = 'inline-block';

            } catch (error) {
                console.error(error);
                alert("Erreur de connexion à l'API. Vérifie que uvicorn tourne bien !");
                loader.style.display = 'none';
            }
        }

        function downloadReport() {
            const domain = document.getElementById('domainInput').value;
            if(!domain) return;
            window.open(`https://secuwatch-api.onrender.com/report?domain=${domain}`, '_blank');
        }
    </script>
</body>
</html>
